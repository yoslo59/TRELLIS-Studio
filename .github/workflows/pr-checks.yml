name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lightweight-checks:
    name: Lightweight checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Check public source and text encoding
        run: |
          python -S -B installer/audit_public.py
          python -S -B tests/check_text_encoding.py

      - name: Test packaging, versions, installers and Server storage
        run: |
          python -S -B tests/public_packaging.py
          python -S -B tests/studio_release.py
          python -S -B tests/hi3d_weights.py
          python -S -B tests/kimodo_installer.py
          python -S -B tests/server_store.py
          python -S -B tests/comfy_profiles.py
          python -S -B tests/native_game_profile.py
          python -S -B tests/native_game_geometry.py
          python -S -B tests/native_high_detail.py
          python -S -B tests/import_worker_status.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax and viewer behavior
        run: |
          npm run check
          node --check web/workflow-graph.js
          node --check web/standard-workflow-graph.js
          node --test tests/hologram_viewer.mjs tests/texture-projection-geometry.mjs tests/texture-projection-auto-align.mjs tests/workflow_topology.mjs
